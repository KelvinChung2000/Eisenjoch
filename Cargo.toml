[workspace]
resolver = "2"
members = ["crates/nextpnr", "crates/nextpnr-upstream", "crates/npnr-python"]

[profile.release]
debug = "line-tables-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
pyo3 = { version = "0.29", features = ["extension-module"] }
log = "0.4"
rustc-hash = "2"
thiserror = "2"
anyhow = "1"
lasso = { version = "0.7", features = ["multi-threaded"] }
rayon = "1"
ndarray = "0.16"
lapjv = "0.3"
nextpnr = { package = "nextpnr-rust", path = "crates/nextpnr" }
nextpnr-upstream = { path = "crates/nextpnr-upstream" }

[patch."https://github.com/lab-emi/RustEDA-Common.git"]
rusteda-core = { git = "https://github.com/KelvinChung2000/RustEDA-Common.git", rev = "0000eddda623758702cb21f360d2e577eeb26c57" }
rusteda-workspace = { git = "https://github.com/KelvinChung2000/RustEDA-Common.git", rev = "0000eddda623758702cb21f360d2e577eeb26c57" }
rusteda-compute = { git = "https://github.com/KelvinChung2000/RustEDA-Common.git", rev = "0000eddda623758702cb21f360d2e577eeb26c57" }
rusteda-formats = { git = "https://github.com/KelvinChung2000/RustEDA-Common.git", rev = "0000eddda623758702cb21f360d2e577eeb26c57" }
