[package]
name = "nextpnr-db"
version = "0.1.0"
edition = "2021"
description = "Himbaechel chip database reader, netlist model and Yosys JSON frontend"

[lib]
name = "nextpnr_db"

[features]
default = []
mmap = ["dep:memmap2"]
test-utils = []

[dependencies]
rustc-hash = { workspace = true }
memmap2 = { workspace = true, optional = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
lasso = { workspace = true }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
rstest = "0.28"

[[test]]
name = "chipdb"
path = "tests/chipdb.rs"
required-features = ["test-utils"]

[[test]]
name = "chipdb_validate"
path = "tests/chipdb_validate.rs"
required-features = ["test-utils"]

[[test]]
name = "chipdb_names"
path = "tests/chipdb_names.rs"
required-features = ["test-utils"]

[[test]]
name = "routed_json"
path = "tests/routed_json.rs"
required-features = ["test-utils"]
