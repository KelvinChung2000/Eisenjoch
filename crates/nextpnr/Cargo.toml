[package]
name = "nextpnr-rust"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of nextpnr FPGA place-and-route"

[lib]
name = "nextpnr"

[features]
test-utils = []

[dependencies]
rustc-hash = { workspace = true }
memmap2 = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
lasso = { workspace = true }
rayon = { workspace = true }
rustfft = "6"
rustdct = "0.7"
ndarray = { workspace = true }
lapjv = { workspace = true }
faer = { version = "0.24", features = ["sparse"] }
dyn-stack = { version = "0.13", features = ["alloc"] }
ruststa = { git = "https://github.com/KelvinChung2000/RustSTA.git", rev = "d5b3a6db16a52106b12c12e7cdd535138bf67398" }
rusteda-core = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "ed0a8e6ecd3cf4b56586a26ab845e29e6e58ca56" }

[dev-dependencies]
petgraph = "0.6"
rstest = "0.28"

[[test]]
name = "chipdb"
path = "tests/chipdb.rs"
required-features = ["test-utils"]

[[test]]
name = "context"
path = "tests/context.rs"
required-features = ["test-utils"]

[[test]]
name = "sa_tests"
path = "tests/sa_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "heap_tests"
path = "tests/heap_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "router1_tests"
path = "tests/router1_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "router2_tests"
path = "tests/router2_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "packer_tests"
path = "tests/packer_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "plugin_tests"
path = "tests/plugin_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "netlist_tests"
path = "tests/netlist_tests.rs"

[[test]]
name = "types_tests"
path = "tests/types_tests.rs"

[[test]]
name = "frontend_tests"
path = "tests/frontend_tests.rs"

[[test]]
name = "region_tests"
path = "tests/region_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "checkpoint_tests"
path = "tests/checkpoint_tests.rs"
required-features = ["test-utils"]

[[test]]
name = "incremental_tests"
path = "tests/incremental_tests.rs"
