[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nextpnr"
requires-python = ">=3.14"
dynamic = ["version"]
description = "Rust reimplementation of nextpnr FPGA place-and-route"
dependencies = ["lark>=1.1"]

[tool.maturin]
manifest-path = "crates/npnr-python/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "nextpnr"

[project.scripts]
nextpnr-himbaechel = "nextpnr_cli:cli"
nextpnr-ispd-benchmarks = "nextpnr.benchmarks.ispd_benchmarks:main"

[project.optional-dependencies]
cli = ["typer>=0.9"]
benchmark = ["matplotlib", "numpy"]

[tool.pytest.ini_options]
# The `test_*.py` files under these directories are benchmark drivers, not
# unit tests: they load a chipdb and run place-and-route at module import, so
# collecting them turns `pytest` into a benchmark run that dies on the first
# missing chipdb. Exclude them so `uv run pytest` reports honestly.
norecursedirs = ["python/nextpnr/benchmarks", "chip_database", "target", ".venv"]
