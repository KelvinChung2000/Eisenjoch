[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nextpnr"
requires-python = ">=3.14"
dynamic = ["version"]
description = "FPGA place-and-route with upstream nextpnr and Eisenjoch's Rust algorithms"
dependencies = []

[tool.maturin]
manifest-path = "crates/npnr-python/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "nextpnr.nextpnr"

[project.scripts]
eisenjoch = "nextpnr.cli:cli"
nextpnr-himbaechel-rust = "nextpnr.rust_cli:cli"
nextpnr-ispd-benchmarks = "nextpnr.benchmarks.ispd_benchmarks:main"

[project.optional-dependencies]
cli = ["loguru>=0.7", "typer>=0.24", "sdf-toolkit", "fasm-toolkit"]
benchmark = ["matplotlib", "numpy"]

[tool.pytest.ini_options]
# The `test_*.py` files under these directories are benchmark drivers, not
# unit tests: they load a chipdb and run place-and-route at module import, so
# collecting them turns `pytest` into a benchmark run that dies on the first
# missing chipdb. Exclude them so `uv run pytest` reports honestly.
norecursedirs = ["python/nextpnr/benchmarks", "chip_database", "target", ".venv"]

[dependency-groups]
chipdb = ["sdf-toolkit"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.uv.sources]
sdf-toolkit = { git = "https://github.com/FPGA-Research/SDF-toolkit.git", rev = "adecec94d993aed96b880b6eafc1308bfe97e460" }
fasm-toolkit = { git = "https://github.com/KelvinChung2000/fasm-toolkit.git", rev = "22d92fa2205bd6d85f93caa8db14328e8d39b6b4" }
